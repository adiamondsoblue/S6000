name: Build S6000 Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out S6000
        uses: actions/checkout@v4
        with:
          path: S6000

      - name: Check out JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Configure
        run: >
          cmake -S S6000 -B S6000/build
          -G "Visual Studio 17 2022"
          -A x64
          -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build VST3 (Release)
        run: cmake --build S6000/build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = "S6000/build/S6000_artefacts/Release/VST3/S6000.vst3"
          if (!(Test-Path $plugin)) {
            Write-Error "VST3 bundle not found at $plugin"
          }
          Compress-Archive -Path $plugin -DestinationPath "S6000-Windows-x64-VST3.zip" -Force

      - name: Upload compiled VST3
        uses: actions/upload-artifact@v4
        with:
          name: S6000-Windows-x64-VST3
          path: S6000-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 14
